<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Administration Africa Biopharma</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body admin-body--centered">

  <main class="admin-auth-card">
    <img src="/assets/images/logo/logo-africa-biopharma.svg" alt="Africa Biopharma" height="40" class="admin-auth-card__logo" />
    <h1>Espace administration</h1>
    <p class="text-muted">Connectez-vous pour gérer les prix, images et coordonnées du site.</p>

    <form id="admin-login-form" class="admin-form" novalidate>
      <div class="order-form__field">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" name="email" autocomplete="username" required />
      </div>

      <div class="order-form__field">
        <label for="admin-password">Mot de passe</label>
        <input type="password" id="admin-password" name="password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn btn-primary admin-form__submit" data-login-submit>
        <span data-login-submit-label>Se connecter</span>
      </button>

      <p class="order-form__error" data-login-error hidden></p>
    </form>
  </main>

  <script src="/js/admin-login.js" defer></script>
</body>
</html>
